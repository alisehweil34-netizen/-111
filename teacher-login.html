<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://exam-dab4c-default-rtdb.firebaseio.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; object-src 'none'; base-uri 'none'; form-action 'self'" />
<meta name="referrer" content="no-referrer" />

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>دخول الأستاذ — نظام الامتحانات</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="center-page">
    <div class="container-narrow">
      <div class="login-hero">
        <div class="mark">EN</div>
        <h1>دخول الأستاذ</h1>
        <p class="muted">لوحة تحكم إدارة الامتحانات</p>
      </div>

      <div class="card">
        <div id="alertBox" class="hidden"></div>

        <form id="loginForm">
          <div class="field">
            <label for="email">اسم المستخدم</label>
            <input type="text" id="email" required autocomplete="username" placeholder="البريد الإلكتروني" />
          </div>
          <div class="field">
            <label for="password">كلمة المرور</label>
            <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••" />
          </div>
          <button type="submit" id="submitBtn" class="btn btn-primary btn-block">
            <span id="btnText">تسجيل الدخول</span>
          </button>
        </form>
      </div>

      <div class="role-switch">
        <span class="muted">لست أستاذًا؟</span>
        <a href="student-login.html">دخول الطالب</a>
      </div>
    </div>
  </div>
  <script src="config.js"></script>
  <script src="local-db.js"></script>
  <script src="utils.js"></script>
  <script src="auth.js"></script>
  <script src="teacher-login.js"></script>
</body>
</html>
